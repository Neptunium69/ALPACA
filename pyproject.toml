[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-robotics"
dynamic = ["version"]
description = "Adaptive Layered Polymodal Agent for Cognitive Action"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Neptunium69"}]
keywords = ["robotics", "embodied-agents", "perception", "navigation"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
rover = ["numpy>=1.24,<2", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.4", "opencv-python>=4.8,<4.12", "ultralytics>=8.3,<9"]

[project.urls]
Repository = "https://github.com/Neptunium69/ALPACA"
Issues = "https://github.com/Neptunium69/ALPACA/issues"
Releases = "https://github.com/Neptunium69/ALPACA/releases"

[tool.setuptools.dynamic]
version = {attr = "alpaca.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alpaca", "alpaca.*", "cria", "cria.*"]
exclude = ["alpaca.legacy", "alpaca.legacy.*"]
namespaces = false

[tool.setuptools.package-data]
alpaca = ["resources/*.txt"]
"*" = ["specification.md"]

[tool.setuptools.data-files]
"share/alpaca_msgs" = ["ros1/alpaca_msgs/package.xml", "ros1/alpaca_msgs/CMakeLists.txt"]
"share/alpaca_msgs/msg" = ["ros1/alpaca_msgs/msg/*.msg"]
